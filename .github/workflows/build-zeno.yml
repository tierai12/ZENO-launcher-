name: Build ZENO CLIENT

on:
  workflow_dispatch:
  push:
    branches: [desktop-foundation]
    paths:
      - "desktop/**"
      - ".github/workflows/build-zeno.yml"

permissions:
  contents: read

jobs:
  windows:
    name: Windows 11 installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows app
        working-directory: desktop
        run: npm run tauri build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: ZENO-CLIENT-Windows-x64
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm install

      - name: Initialize Tauri Android project
        working-directory: desktop
        run: npm run tauri android init -- --ci

      - name: Build Android APK
        working-directory: desktop
        run: npm run tauri android build -- --apk --debug --ci --target aarch64

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ZENO-CLIENT-Android-arm64-APK
          path: desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
